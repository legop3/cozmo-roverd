# Copy to /etc/cozmo-roverd.toml and fill in the Cozmo SSID/password shown on its screen.
[rover]
name = "cozmo"
description = "Cozmo"
color = "#3ba8ff"
private = false
server_url = "ws://YOUR-MRR-SERVER:8080/rover"
max_speed = 250

[wifi]
# DEDICATED adapter; never select the adapter used for Internet/MRR.
interface = "wlan1"
ssid = "Cozmo_XXXXXX"
password = "PASSWORD_SHOWN_ON_COZMO"

[media]
enabled = true
fps = 15
camera_mode = "auto"
# Overlay additional Cozmo hardware telemetry onto RTSP frames.
hud = true
# Optional override, otherwise rtsp://SERVER-HOST:8554/<rover.name>
# rtsp_url = "rtsp://YOUR-MRR-SERVER:8554/cozmo"

# Optional: keep docked Cozmo on a chosen Wi-Fi channel.
# Requires a Home Assistant switch that physically controls dock power.
[channel_reroll]
enabled = false
target_channel = 6 # 1, 6, or 11
max_attempts = 6
home_assistant_url = ""
home_assistant_token = ""
switch_entity = ""
